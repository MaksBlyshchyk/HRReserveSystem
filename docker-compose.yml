services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      DATABASE_PROVIDER: "${DATABASE_PROVIDER:-PostgreSQL}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hrreserve};Username=${POSTGRES_USER:-hrreserve};Password=${POSTGRES_PASSWORD:-change-me};Include Error Detail=false"
      Security__UseHttpsRedirection: "${SECURITY_USE_HTTPS_REDIRECTION:-false}"
      Security__CookieSecurePolicy: "${SECURITY_COOKIE_SECURE_POLICY:-SameAsRequest}"
      Email__Enabled: "${Email__Enabled:-false}"
      Email__Host: "${Email__Host:-}"
      Email__Port: "${Email__Port:-587}"
      Email__UseSsl: "${EMAIL_USE_SSL:-true}"
      Email__UserName: "${Email__UserName:-}"
      Email__Password: "${Email__Password:-}"
      Email__FromEmail: "${Email__FromEmail:-no-reply@example.com}"
      Email__FromName: "${Email__FromName:-HR Reserve System}"
      Email__RedirectAllTo: "${Email__RedirectAllTo:-}"
    volumes:
      - data-protection-keys:/app/DataProtectionKeys
      - email-outbox:/app/EmailOutbox
      - uploaded-resumes:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hrreserve}"
      POSTGRES_USER: "${POSTGRES_USER:-hrreserve}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrreserve} -d ${POSTGRES_DB:-hrreserve}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  data-protection-keys:
  email-outbox:
  uploaded-resumes:
